seed: 14207

run:
  name: medsiglip_zero_shot_binary_tici_control
  output_dir: output_runs_lightning

data:
  config_path: amticis_pipeline/config.yaml
  project_root: .
  pipeline_overrides:
    data:
      label_mode: binary
      num_frames: 8
      image_size: 448
      interpolation: trilinear
      align_corners: true
    views:
      active: [AP, sagittal]
    loader:
      batch_size: 1
      num_workers: 4
      val_batch_size: 1
      val_num_workers: 4
      use_weighted_sampler: false
      pin_memory: false
    transforms:
      train: []
      val: []

input:
  num_frames: 8
  image_size: 448
  views: [AP, sagittal]
  frame_order: chronological

model:
  pretrained_name: google/medsiglip-448
  revision: 9cea28a1a1195f665105faa6e8544c112fd960a4
  dtype: bfloat16
  use_fast_processor: false
  device_map: auto

prompts:
  clinical_v1:
    text_labels:
      - digital subtraction angiography showing unsuccessful reperfusion, mTICI 0, 1, or 2A
      - digital subtraction angiography showing successful reperfusion, mTICI 2B or 3
  concise_v2:
    text_labels:
      - unsuccessful cerebral reperfusion on angiography
      - successful cerebral reperfusion on angiography

intensity_scaling:
  percentile_1_99:
    mode: percentile
    lower: 1.0
    upper: 99.0
  minmax:
    mode: minmax

selection:
  tuning_fraction: 0.20
  manifest_path: output_runs_lightning/medgemma_internal_split.json
  prompt_id: clinical_v1
  scaling_id: percentile_1_99

evaluation:
  threshold: 0.5
  smoke_samples: 10
  bootstrap_replicates: 10000
  maximum_tie_rate: 0.01
