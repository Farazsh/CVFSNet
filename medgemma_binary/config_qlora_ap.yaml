# E2: QLoRA fine-tuning of MedGemma 1.5 4B, AP view only.
#
# Hyperparameters follow Google's official MedGemma LoRA fine-tuning notebook
# (Google-Health/medgemma, notebooks/fine_tune_with_hugging_face.ipynb), which
# is itself the QLoRA-paper recipe: 4-bit NF4 + double quantization, r=16,
# alpha=16, dropout=0.05, "all-linear" targeting, adapter LR 2e-4, max grad norm
# 0.3, warmup ratio 0.03, BF16, gradient checkpointing.
#
# Deviations from that notebook, and why:
#   * target scope is restricted to the language model, so the vision tower stays
#     frozen. Section 7.3 of the experiment plan asks for this, and the MedGemma
#     1.5 report states MedSigLIP was frozen during the model's own training.
#   * modules_to_save (lm_head, embed_tokens) is dropped: the notebook does
#     generative SFT, whereas this experiment reads the last prompt token's
#     hidden state through a BCE classification head (plan section 6).
#   * micro_batch_size 1 with 8 accumulation steps, per plan section 7.3: one
#     study is 8 images x 256 vision tokens and the head needs the final prompt
#     token, which is unambiguous only without padding.
#
# image_size is 896 because that is MedGemma's native SigLIP-400M input
# resolution (mm_tokens_per_image=256). Feeding 256x256 would be upsampled back
# to 896 by the processor, discarding detail for no memory saving.

seed: 14207

run:
  name: medgemma_qlora_binary_tici_ap
  output_dir: output_runs_lightning

wandb:
  enabled: true
  project: medgemma-binary-tici
  group: e2_qlora_ap
  entity: null

data:
  config_path: amticis_pipeline/config.yaml
  project_root: .
  pipeline_overrides:
    data:
      label_mode: binary
      num_frames: 8
      image_size: 896
      interpolation: trilinear
      align_corners: true
    views:
      active: [AP]
    loader:
      batch_size: 1
      num_workers: 4
      val_batch_size: 1
      val_num_workers: 4
      use_weighted_sampler: false
      pin_memory: false
      persistent_workers: true
      prefetch_factor: 2
    transforms:
      # Mild, frame-consistent geometry only (plan section 5.3). torchvision
      # samples one angle per call and applies it to the whole (C, T, H, W) clip,
      # so no artificial temporal motion is introduced. No intensity
      # normalization here: percentile scaling happens in scan_to_rgb_frames.
      train:
        - {name: RandomRotation, params: {degrees: [-10, 10], fill: 192, p: 0.25}}
        - {name: Crop,           params: {crop: [0.1, 0.1, 0.2, 0.1], p: 0.5}}
        - {name: Resize,         params: {}}   # t / visual injected from data.*
      val: []

input:
  num_frames: 8
  image_size: 896
  views: [AP]
  frame_order: chronological

model:
  pretrained_name: google/medgemma-1.5-4b-it
  revision: 91850547d9f0b2fdd21aa7c5f4f3d1a8a52c243b
  use_fast_processor: false
  attn_implementation: sdpa
  head_dropout: 0.2

quantization:
  enabled: true
  bits: 4
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16

lora:
  rank: 16
  alpha: 16
  dropout: 0.05
  # all_linear_language | all_linear_language_projector | attention_only | all_linear
  target_scope: all_linear_language

optimizer:
  adapter_lr: 0.0002
  head_lr: 0.001
  weight_decay: 0.01

training:
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  max_epochs: 25
  early_stopping_patience: 6
  warmup_ratio: 0.03
  scheduler: cosine
  gradient_clip_val: 0.3
  gradient_checkpointing: true
  log_every_steps: 5

prompts:
  clinical_v1:
    preamble: >-
      Review this chronological digital subtraction angiography series.
      Class 0 is unsuccessful reperfusion (mTICI 0, 1, or 2A). Class 1 is
      successful reperfusion (mTICI 2B or 3).
    question: "Which final reperfusion class is shown? Reply with only 0 or 1."
  concise_v2:
    preamble: >-
      The images below are chronological DSA frames.
    question: >-
      Classify the final reperfusion outcome: reply 0 for mTICI 0/1/2A or 1
      for mTICI 2B/3. Reply with one digit only.

intensity_scaling:
  percentile_1_99:
    mode: percentile
    lower: 1.0
    upper: 99.0
  minmax:
    mode: minmax

selection:
  # split_seed is fixed at 14207 for every seed and strategy so that the
  # development/tuning/final partition never moves between runs.
  split_seed: 14207
  tuning_fraction: 0.20
  manifest_path: output_runs_lightning/medgemma_internal_split.json
  prompt_id: clinical_v1
  scaling_id: percentile_1_99

evaluation:
  threshold: 0.5
  bootstrap_replicates: 10000
