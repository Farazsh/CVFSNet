[project]
name = "cvfsnet"
version = "0.1.0"
description = "CVFSNet training and inference dependencies"
requires-python = ">=3.9,<3.13"
dependencies = [
  "torch==2.4.1",
  "torchvision==0.19.1",
  "numpy",
  "pillow",
  "opencv-python",
  "simpleitk",
  "nibabel",
  "lmdb",
  "scikit-image",
  "torchio",
  "fvcore",
  "thop",
  "yacs",
  "prefetch-generator",
  "torchsampler",
  "sync-batchnorm",
  "loguru",
  "wandb",
  "setproctitle",
  "gitpython",
  "pyyaml",
  "termcolor",
  "tqdm",
  "scikit-learn",
  "matplotlib",
  "python-dotenv",
  "python-pptx>=1.0.2",
  "pytorch-lightning>=2.6.0",
  "transformers>=4.57.6",
  "torchmetrics",
  "pandas",
  "xlsxwriter",
  "lightly-train>=0.16.2,<0.17",
  "timm>=1.0.28",
  "easydict>=1.13",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
