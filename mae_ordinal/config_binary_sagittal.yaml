# VideoMAE binary T012a vs T2b3 — sagittal view, full fine-tune

seed: 14207

run:
  name: mae_binary_t012a_sag
  output_dir: output_runs_lightning

data:
  config_path: amticis_pipeline/config.yaml
  project_root: .
  preset: sagittal_binary
  pipeline_overrides:
    loader:
      batch_size: 8
      num_workers: 8
      val_batch_size: 8
      val_num_workers: 8
      use_weighted_sampler: true

model:
  name: videomae_binary
  input:
    type: single_view_tensor
    view: sagittal
  params:
    pretrained_name: MCG-NJU/videomae-base-finetuned-kinetics
    normalize: imagenet
    freeze_backbone: false
    hidden_dropout_prob: 0.1
    dropout: 0.5
    expected_num_frames: 16
    expected_image_size: 224

optimizer:
  name: AdamW
  base_lr: 0.0002
  weight_decay: 0.05
  layer_decay: 0.75
  betas: [0.9, 0.999]

scheduler:
  name: warmup_cosine
  interval: epoch
  warmup_epochs: 5
  warmup_start_factor: 0.01
  eta_min: 0.000001

trainer:
  max_epochs: 75
  accelerator: gpu
  devices: [0]
  precision: 16-mixed
  log_every_n_steps: 5
  deterministic: false
  benchmark: true
  gradient_clip_val: 1.0

checkpointing:
  enabled: true
  monitor: val/auroc
  mode: max
  save_top_k: 1
  save_last: true

early_stopping:
  enabled: true
  monitor: val/auroc
  mode: max
  patience: 25

threshold:
  strategy: maximize_macro_f1
  tie_breaker: closest_to_0.5

evaluation:
  scores_filename: val_scores.csv
  json_filename: evaluation.json
  workbook_suffix: videomae_binary_tici_sag_eval.xlsx
  excel_metadata:
    Model: videomae-base-kinetics
    Dimension: 3D
    Label1: BinaryTICI
    Label2: T012a_vs_T2b3
    InputSize: 16x224x224
    Optimizer: AdamWLLRD2e-4Cosine
    Loop: train_val
    ExperimentVersion: seed14207
    ValidationSplit: val

logging:
  csv:
    enabled: true
  wandb:
    enabled: true
    project: AmTICIS
    entity: null
    tags: [videomae, binary, bce, t012a, sagittal, finetune]
    offline: false
    api_key_env: WANDB_API_KEY
    log_model: false
