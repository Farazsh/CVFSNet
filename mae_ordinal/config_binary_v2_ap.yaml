# VideoMAE2 binary T012a vs T2b3 — AP (coronal) view, full fine-tune (4-GPU DDP)

seed: 14207

run:
  name: mae_v2_binary_t012a_ap_8frames
  output_dir: output_runs_lightning

data:
  config_path: amticis_pipeline/config.yaml
  project_root: .
  preset: ap_binary
  pipeline_overrides:
    data:
      num_frames: 8
    loader:
      # Per-GPU batch; effective batch = 2 * 4 GPUs = 8
      batch_size: 2
      num_workers: 4
      val_batch_size: 2
      val_num_workers: 4
      use_weighted_sampler: true

model:
  name: videomaev2_binary
  input:
    type: single_view_tensor
    view: AP
  params:
    pretrained_name: OpenGVLab/VideoMAEv2-Base
    trust_remote_code: true
    normalize: imagenet
    freeze_backbone: false
    dropout: 0.5
    expected_num_frames: 8
    expected_image_size: 224

optimizer:
  name: AdamW
  base_lr: 0.0002
  weight_decay: 0.05
  layer_decay: 0.75
  betas: [0.9, 0.999]

scheduler:
  name: warmup_cosine
  interval: epoch
  warmup_epochs: 5
  warmup_start_factor: 0.01
  eta_min: 0.000001

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: [0, 1, 2, 3]
  strategy: ddp
  precision: 16-mixed
  log_every_n_steps: 5
  deterministic: false
  benchmark: true
  gradient_clip_val: 1.0

checkpointing:
  enabled: true
  monitor: val/auroc
  mode: max
  save_top_k: 1
  save_last: true

early_stopping:
  enabled: false
  monitor: val/auroc
  mode: max
  patience: 25

threshold:
  strategy: maximize_macro_f1
  tie_breaker: closest_to_0.5

evaluation:
  scores_filename: val_scores.csv
  json_filename: evaluation.json
  workbook_suffix: videomaev2_binary_tici_ap_8frames_eval.xlsx
  excel_metadata:
    Model: videomaev2-base
    Dimension: 3D
    Label1: BinaryTICI
    Label2: T012a_vs_T2b3
    InputSize: 8x224x224
    Optimizer: AdamWLLRD2e-4Cosine
    Loop: train_val
    ExperimentVersion: seed14207
    ValidationSplit: val

logging:
  csv:
    enabled: true
  wandb:
    enabled: true
    project: AmTICIS
    entity: null
    tags: [videomaev2, binary, bce, t012a, ap, finetune, ddp4, frames8]
    offline: false
    api_key_env: WANDB_API_KEY
    log_model: false
